name: Main Yamal

on:
  workflow_dispatch:

  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: football-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: TEST RSS 66
        run: |
          echo "========================================"
          echo "TESTING RSS 66"
          echo "========================================"
          curl -L --max-time 20 -A "Mozilla/5.0" -v \
            "https://www.khabarvarzeshi.com/rss/tp/66" \
            -o /tmp/rss66.xml
          echo "CURL EXIT CODE: $?"
          echo "RSS 66 FILE SIZE:"
          wc -c /tmp/rss66.xml
          echo "========================================"
          echo "RSS 66 TEST FINISHED"
          echo "========================================"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          set -o pipefail
          echo "========================================"
          echo "STARTING FOOTBALL BOT"
          echo "========================================"
          python -u bot.py 2>&1 | tee bot.log
          echo "========================================"
          echo "BOT PROCESS FINISHED"
          echo "========================================"

      - name: Show bot log
        if: always()
        run: |
          echo "========================================"
          echo "FULL BOT LOG"
          echo "========================================"
          if [ -f bot.log ]; then
            cat bot.log
          else
            echo "bot.log was not created."
          fi
          echo "========================================"
          echo "END BOT LOG"
          echo "========================================"

      - name: Save bot data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
`
