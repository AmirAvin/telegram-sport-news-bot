name: Check Sports Video Sources

on:
  workflow_dispatch:

jobs:
  check-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install libraries
        run: |
          pip install requests feedparser beautifulsoup4

      - name: Inspect RSS video sources
        run: |
          python - <<'PY'
          import requests
          import feedparser
          import re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          }

          RSS_SOURCES = [
              ("ISNA", "https://www.isna.ir/rss"),
              ("خبرورزشی", "https://www.khabarvarzeshi.com/rss"),
              ("ورزش3", "https://www.varzesh3.com/rss"),
              ("تسنیم", "https://www.tasnimnews.com/fa/rss"),
          ]

          KEYWORDS = [
              "فوتبال",
              "استقلال",
              "پرسپولیس",
              "سپاهان",
              "تراکتور",
              "ذوب آهن",
              "گل گهر",
              "نساجی",
              "لیگ برتر",
              "جام حذفی",
              "جام جهانی",
              "لیگ قهرمانان",
              "تیم ملی",
              "طارمی",
              "آزمون",
              "جهانبخش",
              "قایدی",
              "رونالدو",
              "مسی",
              "رئال مادرید",
              "بارسلونا",
              "منچستریونایتد",
              "منچسترسیتی",
              "لیورپول",
              "چلسی",
              "آرسنال",
              "بایرن مونیخ",
              "اینتر",
              "میلان",
              "یوونتوس"
          ]

          def clean(text):
              soup = BeautifulSoup(
                  text or "",
                  "html.parser"
              )

              return re.sub(
                  r"\s+",
                  " ",
                  soup.get_text(" ", strip=True)
              )

          def is_sport(title, summary):
              text = (
                  f"{title} {summary}"
              ).lower()

              return any(
                  keyword.lower() in text
                  for keyword in KEYWORDS
              )

          def inspect_entry(entry, source_name):

              title = clean(
                  entry.get("title", "")
              )

              summary = clean(
                  entry.get("summary", "")
              )

              link = (
                  entry.get("link", "")
                  or ""
              ).strip()

              if not link:
                  return False

              if not is_sport(
                  title,
                  summary
              ):
                  return False

              print()
              print("=" * 90)
              print("SOURCE:", source_name)
              print("TITLE:", title)
              print("ARTICLE:", link)
              print("=" * 90)

              # ---------------------------------
              # RSS MEDIA CONTENT
              # ---------------------------------

              media_content = entry.get(
                  "media_content",
                  []
              )

              print()
              print(
                  "MEDIA CONTENT COUNT:",
                  len(media_content)
              )

              for i, media in enumerate(
                  media_content,
                  1
              ):

                  print(
                      f"MEDIA_CONTENT #{i}:"
                  )

                  for key in [
                      "url",
                      "type",
                      "medium",
                      "width",
                      "height"
                  ]:

                      if media.get(key):
                          print(
                              f"  {key}:",
                              media.get(key)
                          )

              # ---------------------------------
              # MEDIA THUMBNAIL
              # ---------------------------------

              thumbnails = entry.get(
                  "media_thumbnail",
                  []
              )

              print()
              print(
                  "MEDIA THUMBNAIL COUNT:",
                  len(thumbnails)
              )

              for i, media in enumerate(
                  thumbnails,
                  1
              ):

                  print(
                      f"THUMBNAIL #{i}:",
                      media.get("url")
                  )

              # ---------------------------------
              # ENCLOSURES
              # ---------------------------------

              enclosures = entry.get(
                  "enclosures",
                  []
              )

              print()
              print(
                  "ENCLOSURE COUNT:",
                  len(enclosures)
              )

              for i, enclosure in enumerate(
                  enclosures,
                  1
              ):

                  print(
                      f"ENCLOSURE #{i}:"
                  )

                  for key in [
                      "href",
                      "url",
                      "type",
                      "length"
                  ]:

                      if enclosure.get(key):
                          print(
                              f"  {key}:",
                              enclosure.get(key)
                          )

              # ---------------------------------
              # RSS CONTENT
              # ---------------------------------

              contents = entry.get(
                  "content",
                  []
              )

              print()
              print(
                  "CONTENT BLOCK COUNT:",
                  len(contents)
              )

              for i, content in enumerate(
                  contents,
                  1
              ):

                  value = content.get(
                      "value",
                      ""
                  )

                  print(
                      f"CONTENT #{i} TYPE:",
                      content.get("type")
                  )

                  urls = re.findall(
                      r'https?://[^"\'>\s]+',
                      value or ""
                  )

                  for url in urls:

                      lower = url.lower()

                      if any(
                          x in lower
                          for x in [
                              ".mp4",
                              ".m3u8",
                              ".webm",
                              ".mov",
                              "video",
                              "media"
                          ]
                      ):

                          print(
                              "  POSSIBLE VIDEO:",
                              url[:1000]
                          )

              # ---------------------------------
              # SUMMARY HTML
              # ---------------------------------

              print()
              print(
                  "SUMMARY HTML VIDEO CHECK"
              )

              summary_html = (
                  entry.get("summary", "")
                  or ""
              )

              soup = BeautifulSoup(
                  summary_html,
                  "html.parser"
              )

              for tag in soup.find_all(
                  ["video", "source", "iframe"]
              ):

                  print(
                      "  TAG:",
                      tag.name
                  )

                  for attr in [
                      "src",
                      "data-src",
                      "href"
                  ]:

                      value = tag.get(attr)

                      if value:

                          print(
                              "  URL:",
                              urljoin(
                                  link,
                                  value
                              )
                          )

              return True

          # ============================================
          # RUN
          # ============================================

          total = 0

          for source_name, rss_url in RSS_SOURCES:

              print()
              print("#" * 90)
              print(
                  "READING:",
                  source_name
              )
              print(
                  "RSS:",
                  rss_url
              )
              print("#" * 90)

              try:

                  response = requests.get(
                      rss_url,
                      headers=HEADERS,
                      timeout=30
                  )

                  print(
                      "RSS STATUS:",
                      response.status_code
                  )

                  feed = feedparser.parse(
                      response.content
                  )

                  source_count = 0

                  for entry in feed.entries:

                      if inspect_entry(
                          entry,
                          source_name
                      ):

                          source_count += 1
                          total += 1

                          # فقط 3 خبر از هر سایت
                          if source_count >= 3:
                              break

              except Exception as error:

                  print(
                      "RSS ERROR:",
                      repr(error)
                  )

          print()
          print("#" * 90)
          print(
              "FINISHED"
          )
          print(
              "SPORT ARTICLES INSPECTED:",
              total
          )
          print(
              "NO TELEGRAM MESSAGE WAS SENT"
          )
          print("#" * 90)

          PY
