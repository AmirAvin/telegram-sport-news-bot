name: Check Videos

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests

      - name: Test
        env:
          TEST_URL: https://www.aparat.com/video/video/embed/videohash/nybi2s7/vt/frame
        run: python -c "import os,requests; r=requests.get(os.environ['TEST_URL'],headers={'User-Agent':'Mozilla/5.0'},timeout=30); print('STATUS:',r.status_code); print('FINAL:',r.url); print('TYPE:',r.headers.get('content-type')); print('SIZE:',len(r.text)); open('aparat.html','w',encoding='utf-8').write(r.text)"

      - name: Search video
        run: |
          grep -Eoi 'https?://[^" ]+\.(mp4|m3u8)[^" ]*' aparat.html | head -20 || tr
