name: Test Aparat Video

on:
  workflow_dispatch:

jobs:
  test-aparat:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Aparat API
        run: |
          python -u - <<'PY'
          import requests
          import json
          import sys

          VIDEO_HASH = "mxh0449"

          API_URL = (
              "https://www.aparat.com/api/fa/v1/video/video/show/"
              f"videohash/{VIDEO_HASH}"
          )

          print("=" * 70)
          print("APARAT VIDEO TEST")
          print("=" * 70)
          print("VIDEO HASH:", VIDEO_HASH)
          print("API:", API_URL)
          print()

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          try:
              r = requests.get(
                  API_URL,
                  headers=headers,
                  timeout=30
              )

              print("API STATUS:", r.status_code)
              print("CONTENT TYPE:", r.headers.get("content-type"))
              print()

              print("RESPONSE PREVIEW:")
              print(r.text[:3000])
              print()

              if r.status_code != 200:
                  print("❌ APARAT API FAILED")
                  sys.exit(1)

              try:
                  data = r.json()
              except Exception as e:
                  print("❌ JSON ERROR:", repr(e))
                  sys.exit(1)

              print("JSON RECEIVED: YES")
              print()

              def find_mp4(obj, path="root"):
                  if isinstance(obj, dict):
                      for key, value in obj.items():
                          current_path = f"{path}.{key}"

                          if isinstance(value, str):
                              if ".mp4" in value.lower():
                                  print("✅ MP4 FOUND AT:", current_path)
                                  print("MP4 URL:", value)
                                  return value

                          result = find_mp4(value, current_path)

                          if result:
                              return result

                  elif isinstance(obj, list):
                      for i, value in enumerate(obj):
                          result = find_mp4(
                              value,
                              f"{path}[{i}]"
                          )

                          if result:
                              return result

                  return None

              mp4_url = find_mp4(data)

              print()

              if not mp4_url:
                  print("❌ NO MP4 URL FOUND")
                  print()
                  print("FULL JSON:")
                  print(json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )[:10000])
                  sys.exit(1)

              print("=" * 70)
              print("TESTING MP4 CONNECTION")
              print("=" * 70)

              video = requests.get(
                  mp4_url,
                  headers=headers,
                  stream=True,
                  timeout=30
              )

              print("MP4 STATUS:", video.status_code)
              print(
                  "MP4 CONTENT TYPE:",
                  video.headers.get("content-type")
              )
              print(
                  "MP4 CONTENT LENGTH:",
                  video.headers.get("content-length")
              )

              if video.status_code != 200:
                  print("❌ MP4 URL NOT ACCESSIBLE")
                  sys.exit(1)

              print()
              print("=" * 70)
              print("✅ APARAT VIDEO TEST SUCCESS")
              print("✅ API WORKS")
              print("✅ MP4 URL FOUND")
              print("✅ MP4 URL ACCESSIBLE")
              print("=" * 70)

          except Exception as e:
              print()
              print("=" * 70)
              print("❌ UNEXPECTED ERROR")
              print("=" * 70)
              print(type(e).__name__)
              print(repr(e))
              sys.exit(1)
          PY
