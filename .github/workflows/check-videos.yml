name: Test Aparat HLS

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Aparat HLS
        run: |
          python - <<'PY'
          import requests

          video_hash = "nybi2s7"

          api = (
              "https://www.aparat.com/api/fa/v1/video/video/show/videohash/"
              + video_hash
          )

          r = requests.get(
              api,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=30
          )

          print("API STATUS:", r.status_code)

          data = r.json()

          attrs = data["data"]["attributes"]

          hls = attrs.get("hls_link")

          print("VIDEO TITLE:", attrs.get("title"))
          print("DURATION:", attrs.get("duration"))
          print("HLS FOUND:", bool(hls))

          if not hls:
              raise SystemExit("HLS LINK NOT FOUND")

          with open("hls_url.txt", "w") as f:
              f.write(hls)

          print("HLS URL SAVED")
          PY

      - name: Convert HLS to MP4
        run: |
          HLS_URL="$(cat hls_url.txt)"

          echo "Starting FFmpeg..."

          ffmpeg \
            -y \
            -i "$HLS_URL" \
            -c copy \
            -movflags +faststart \
            test-video.mp4

      - name: Check MP4
        run: |
          ls -lh test-video.mp4
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            test-video.mp4

          echo "================================"
          echo "✅ APARAT HLS -> MP4 SUCCESS"
          echo "================================"
          echo "NO TELEGRAM MESSAGE SENT"
`
