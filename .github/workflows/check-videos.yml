name: Check Aparat Video

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Test Aparat
        run: |
          python - <<'PY'
          import requests
          import re
          import json

          VIDEO_HASHES = [
              "nybi2s7",
              "afz2t8z",
              "wciz0tp"
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }

          for video_hash in VIDEO_HASHES:

              print()
              print("=" * 80)
              print("APARAT VIDEO HASH:", video_hash)
              print("=" * 80)

              urls = [
                  f"https://www.aparat.com/video/video/embed/videohash/{video_hash}/vt/frame",
                  f"https://www.aparat.com/v/{video_hash}",
              ]

              for url in urls:

                  print()
                  print("REQUEST:", url)

                  try:

                      r = requests.get(
                          url,
                          headers=HEADERS,
                          timeout=30,
                          allow_redirects=True
                      )

                      print(
                          "STATUS:",
                          r.status_code
                      )

                      print(
                          "FINAL URL:",
                          r.url
                      )

                      print(
                          "CONTENT TYPE:",
                          r.headers.get(
                              "content-type"
                          )
                      )

                      html = r.text

                      print(
                          "HTML SIZE:",
                          len(html)
                      )

                      found = set()

                      # -----------------------------
                      # Direct MP4
                      # -----------------------------

                      patterns = [
                          r'https?://[^"\']+\.mp4[^"\']*',
                          r'https?:\\/\\/[^"\\']+\.mp4[^"\\']*',
                          r'"url"\s*:\s*"([^"]+)"',
                          r'"file"\s*:\s*"([^"]+)"',
                          r'"src"\s*:\s*"([^"]+)"',
                          r'"videoUrl"\s*:\s*"([^"]+)"',
                          r'"video_url"\s*:\s*"([^"]+)"'
                      ]

                      for pattern in patterns:

                          matches = re.findall(
                              pattern,
                              html,
                              flags=re.I
                          )

                          for match in matches:

                              if isinstance(
                                  match,
                                  tuple
                              ):
                                  match = match[0]

                              match = (
                                  match
                                  .replace(
                                      "\\/",
                                      "/"
                                  )
                                  .replace(
                                      "\\u0026",
                                      "&"
                                  )
                              )

                              if (
                                  "http" in match
                                  or ".mp4" in match
                              ):

                                  found.add(
                                      match
                                  )

                      # -----------------------------
                      # JSON data
                      # -----------------------------

                      for keyword in [
                          "progressive",
                          "playlist",
                          "video",
                          "file",
                          "source"
                      ]:

                          positions = [
                              m.start()
                              for m in re.finditer(
                                  keyword,
                                  html,
                                  flags=re.I
                              )
                          ]

                          print(
                              f"{keyword.upper()} OCCURRENCES:",
                              len(positions)
                          )

                          for pos in positions[:5]:

                              start = max(
                                  0,
                                  pos - 300
                              )

                              end = min(
                                  len(html),
                                  pos + 700
                              )

                              snippet = html[
                                  start:end
                              ]

                              if (
                                  ".mp4" in snippet
                                  or "http" in snippet
                              ):

                                  print(
                                      "SNIPPET:"
                                  )

                                  print(
                                      snippet[:1000]
                                  )

                      print()
                      print(
                          "POSSIBLE VIDEO URLS:"
                      )

                      if found:

                          for item in sorted(found):

                              print(
                                  item[:2000]
                              )

                      else:

                          print(
                              "NO DIRECT MP4 FOUND"
                          )

                  except Exception as error:

                      print(
                          "ERROR:",
                          repr(error)
                      )

          print()
          print("=" * 80)
          print(
              "APARAT TEST FINISHED"
          )
          print(
              "NO TELEGRAM MESSAGE SENT"
          )
          print("=" * 80)

          PY
