name: Test Aparat Video

on:
  workflow_dispatch:

jobs:
  test-aparat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Aparat API and MP4
        run: |
          python - <<'PY'
          import requests

          VIDEO_HASH = "mxh0449"

          API_URL = (
              "https://www.aparat.com/api/fa/v1/video/video/show/"
              f"videohash/{VIDEO_HASH}"
          )

          print("=" * 70)
          print("APARAT VIDEO TEST")
          print("=" * 70)
          print("VIDEO HASH:", VIDEO_HASH)
          print("API:", API_URL)
          print()

          headers = {
              "User-Agent": "Mozilla/5.0"
          }

          r = requests.get(
              API_URL,
              headers=headers,
              timeout=30
          )

          print("API STATUS:", r.status_code)
          print("CONTENT TYPE:", r.headers.get("content-type"))
          print()

          if r.status_code != 200:
              print("❌ Aparat API failed")
              print(r.text[:1000])
              raise SystemExit(1)

          data = r.json()

          attrs = data.get("data", {}).get("attributes", {})

          print("TITLE:")
          print(attrs.get("title"))
          print()

          print("DURATION:")
          print(attrs.get("duration"), "seconds")
          print()

          print("CONTENT TYPE:")
          print(attrs.get("content_type"))
          print()

          print("PROCESS:")
          print(attrs.get("process"))
          print()

          file_links = attrs.get("file_link_all", [])

          print("MP4 PROFILES:", len(file_links))
          print()

          mp4_url = None

          for item in file_links:
              profile = item.get("profile")
              urls = item.get("urls", [])

              print("PROFILE:", profile)
              print("URL COUNT:", len(urls))

              if urls:
                  print("MP4 FOUND: YES")

                  if mp4_url is None:
                      mp4_url = urls[0]

          print()

          if not mp4_url:
              print("❌ NO MP4 URL FOUND")
              raise SystemExit(1)

          print("=" * 70)
          print("MP4 URL FOUND")
          print("=" * 70)

          print("Testing MP4 connection...")

          video = requests.get(
              mp4_url,
              headers=headers,
              stream=True,
              timeout=30
          )

          print("MP4 STATUS:", video.status_code)
          print("MP4 CONTENT TYPE:", video.headers.get("content-type"))
          print("MP4 CONTENT LENGTH:", video.headers.get("content-length"))

          if video.status_code != 200:
              print("❌ MP4 URL cannot be accessed")
              raise SystemExit(1)

          content_type = video.headers.get("content-type", "")

          if "video" not in content_type and "octet-stream" not in content_type:
              print("⚠️ WARNING: unexpected content type")

          print()
          print("=" * 70)
          print("✅ APARAT VIDEO TEST SUCCESS")
          print("✅ API WORKS")
          print("✅ MP4 URL FOUND")
          print("✅ MP4 URL ACCESSIBLE")
          print("=" * 70)
          PY
