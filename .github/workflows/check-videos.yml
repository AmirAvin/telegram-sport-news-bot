name: Check Aparat API

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests

      - name: Test Aparat
        run: |
          python - <<'PY'
          import requests
          import json

          video_hash = "nybi2s7"

          urls = [
              f"https://www.aparat.com/api/fa/v1/video/video/show/videohash/{video_hash}",
              f"https://www.aparat.com/api/fa/v1/video/video/show/videohash/{video_hash}/",
              f"https://www.aparat.com/api/fa/v1/video/video/show/{video_hash}"
          ]

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          for url in urls:
              print()
              print("=" * 70)
              print("URL:", url)
              print("=" * 70)

              try:
                  r = requests.get(
                      url,
                      headers=headers,
                      timeout=30
                  )

                  print("STATUS:", r.status_code)
                  print("TYPE:", r.headers.get("content-type"))
                  print("SIZE:", len(r.text))
                  print("RESPONSE:")
                  print(r.text[:5000])

              except Exception as e:
                  print("ERROR:", repr(e))

          print()
          print("=" * 70)
          print("TEST FINISHED")
          print("=" * 70)
          PY
