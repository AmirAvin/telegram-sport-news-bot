name: Check Videos

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests feedparser beautifulsoup4

      - name: Check Khabar Varzeshi
        run: |
          python - <<'PY'
          import requests
          import feedparser
          import re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          HEADERS = {
              "User-Agent": "Mozilla/5.0"
          }

          rss = "https://www.khabarvarzeshi.com/rss"

          print("=" * 60)
          print("KHABAR VARZESHI VIDEO CHECK")
          print("=" * 60)

          r = requests.get(
              rss,
              headers=HEADERS,
              timeout=30
          )

          print("RSS STATUS:", r.status_code)

          feed = feedparser.parse(r.content)

          count = 0

          for entry in feed.entries:

              title = BeautifulSoup(
                  entry.get("title", ""),
                  "html.parser"
              ).get_text(" ", strip=True)

              url = entry.get("link", "")

              if "ویدیو" not in title and "ویدئ" not in title:
                  continue

              count += 1

              print()
              print("-" * 60)
              print("TITLE:", title)
              print("ARTICLE:", url)

              try:
                  page = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=30
                  )

                  print(
                      "PAGE STATUS:",
                      page.status_code
                  )

                  soup = BeautifulSoup(
                      page.text,
                      "html.parser"
                  )

                  found = set()

                  for meta in soup.find_all("meta"):

                      key = (
                          meta.get("property")
                          or meta.get("name")
                          or ""
                      ).lower()

                      value = meta.get("content", "")

                      if (
                          "video" in key
                          and value
                      ):

                          value = urljoin(
                              url,
                              value
                          )

                          print(
                              "META VIDEO:",
                              value
                          )

                          found.add(value)

                  for video in soup.find_all("video"):

                      src = video.get("src")

                      if src:
                          src = urljoin(url, src)

                          print(
                              "VIDEO SRC:",
                              src
                          )

                          found.add(src)

                      for source in video.find_all("source"):

                          src = (
                              source.get("src")
                              or source.get("data-src")
                          )

                          if src:
                              src = urljoin(url, src)

                              print(
                                  "SOURCE:",
                                  src
                              )

                              found.add(src)

                  for iframe in soup.find_all("iframe"):

                      src = iframe.get("src")

                      if src:
                          src = urljoin(url, src)

                          print(
                              "IFRAME:",
                              src
                          )

                          found.add(src)

                  patterns = [
                      r'https?://[^"\']+\.mp4[^"\']*',
                      r'https?://[^"\']+\.m3u8[^"\']*'
                  ]

                  for pattern in patterns:

                      matches = re.findall(
                          pattern,
                          page.text,
                          re.I
                      )

                      for match in matches:

                          print(
                              "RAW VIDEO:",
                              match[:1000]
                          )

                          found.add(match)

                  print()
                  print("VIDEO URL COUNT:", len(found))

                  if not found:
                      print(
                          "NO DIRECT VIDEO FOUND"
                      )

              except Exception as e:

                  print(
                      "ARTICLE ERROR:",
                      repr(e)
                  )

              if count >= 5:
                  break

          print()
          print("=" * 60)
          print("CHECK FINISHED")
          print("NO TELEGRAM MESSAGE SENT")
          print("=" * 60)

          P
