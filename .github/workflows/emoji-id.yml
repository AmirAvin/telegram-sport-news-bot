name: Check LigaBartar Emoji

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Custom Emoji
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python -c "import os,requests; r=requests.get('https://api.telegram.org/bot'+os.environ['BOT_TOKEN']+'/getCustomEmojiStickers', params={'custom_emoji_ids':'[\"5791645007882495057\"]'}); print('STATUS:',r.status_code); print(r.text); r.raise_for_status()"
