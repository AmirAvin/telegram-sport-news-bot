name: Get Animated Emoji ID

on:
  workflow_dispatch:

jobs:
  get-emoji:
    runs-on: ubuntu-latest

    steps:
      - name: Get Emoji ID
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json

          token = os.environ["BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getCustomEmojiStickers"

          emoji_id = "5791645007882495057"

          response = requests.get(
              url,
              params={
                  "custom_emoji_ids": json.dumps([emoji_id])
              },
              timeout=30
          )

          print("STATUS:", response.status_code)
          print(response.text)
          PY
