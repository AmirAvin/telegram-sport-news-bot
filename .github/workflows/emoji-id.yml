name: Test LigaBartar Custom Emoji

on:
  workflow_dispatch:

jobs:
  test-emoji:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Telegram library
        run: pip install python-telegram-bot==20.8

      - name: Send Custom Emoji Test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          cat > send_emoji.py <<'PY'
          import os
          import asyncio
          from telegram import Bot

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHANNEL_ID = os.environ["CHANNEL_ID"]
          CUSTOM_EMOJI_ID = "5791832221211959289"

          async def main():
              bot = Bot(token=BOT_TOKEN)

              text = (
                  f'<tg-emoji emoji-id="{CUSTOM_EMOJI_ID}">🏆</tg-emoji> '
                  'تست لوگوی لیگ‌برتر @ligebartar24'
              )

              message = await bot.send_message(
                  chat_id=CHANNEL_ID,
                  text=text,
                  parse_mode="HTML"
              )

              print("MESSAGE SENT")
              print("Message ID:", message.message_id)

          asyncio.run(main())
          PY

          python send_emoji.py
`
