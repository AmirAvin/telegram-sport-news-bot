name: Inspect Telegram Emoji

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Telegram library
        run: pip install python-telegram-bot==20.8

      - name: Run python
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cat > test_telegram.py <<'PY'
          import os
          import asyncio
          from telegram import Bot

          async def main():
              bot = Bot(token=os.environ["BOT_TOKEN"])
              me = await bot.get_me()
              print("BOT OK")
              print("Username:", me.username)
              print("ID:", me.id)

          asyncio.run(main())
          PY

          python test_telegram.py
