steps:
  - name: Check Custom Emoji
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    run: |
      python - <<'PY'
      import os
      import requests

      token = os.environ["BOT_TOKEN"]
      emoji_id = "5791645007882495057"

      url = f"https://api.telegram.org/bot{token}/getCustomEmojiStickers"

      response = requests.get(
          url,
          params={
              "custom_emoji_ids": emoji_id
          },
          timeout=30
      )

      print("STATUS:", response.status_code)
      print("================================")
      print(response.text)
      print("================================")

      if not response.ok:
          raise SystemExit(1)
      P
