name: Test LigaBartar Custom Emoji

on:
  workflow_dispatch:

jobs:
  test-custom-emoji:
    runs-on: ubuntu-latest

    steps:
      - name: Send Custom Emoji Test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          channel = os.environ["CHANNEL"]

          emoji_id = "5791832221211959289"

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          payload = {
              "chat_id": channel,
              "text": "🏆 @ligebartar24",
              "entities": [
                  {
                      "type": "custom_emoji",
                      "offset": 0,
                      "length": 2,
                      "custom_emoji_id": emoji_id
                  }
              ]
          }

          response = requests.post(
              url,
              json=payload,
              timeout=30
          )

          print("STATUS:", response.status_code)
          print(response.text)
          PY
