name: Find LigaBartar Custom Emoji ID

on:
  workflow_dispatch:

jobs:
  find-emoji:
    runs-on: ubuntu-latest

    steps:
      - name: Find Custom Emoji ID
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          bot_token = os.environ["BOT_TOKEN"]

          sticker_set_name = "LigaBartar24Emoji"

          url = f"https://api.telegram.org/bot{bot_token}/getStickerSet"

          response = requests.get(
              url,
              params={
                  "name": sticker_set_name
              },
              timeout=30
          )

          print("STATUS:", response.status_code)

          data = response.json()

          print("OK:", data.get("ok"))

          if not data.get("ok"):
              print("ERROR:")
              print(data)
              raise SystemExit(1)

          sticker_set = data["result"]

          print("================================")
          print("SET NAME:", sticker_set.get("name"))
          print("SET TITLE:", sticker_set.get("title"))
          print("SET TYPE:", sticker_set.get("sticker_type"))
          print("NUMBER OF EMOJIS:", len(sticker_set.get("stickers", [])))
          print("================================")

          for i, sticker in enumerate(
              sticker_set.get("stickers", []),
              start=1
          ):
              print()
              print("EMOJI NUMBER:", i)
              print("FILE ID:", sticker.get("file_id"))
              print("FILE UNIQUE ID:", sticker.get("file_unique_id"))
              print("TYPE:", sticker.get("type"))
              print("EMOJI:", sticker.get("emoji"))
              print(
                  "CUSTOM EMOJI ID:",
                  sticker.get("custom_emoji_id")
              )
              print("SET NAME:", sticker.get("set_name"))

          print()
          print("================================")
          print("DONE")
          print("================================")
          PY
