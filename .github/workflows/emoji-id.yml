name: Test LigaBartar Custom Emoji

on:
  workflow_dispatch:

jobs:
  test-custom-emoji:
    runs-on: ubuntu-latest

    steps:
      - name: Send Custom Emoji Test
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          channel = os.environ["CHANNEL"]

          emoji_id = "5791832221211959289"

          text = (
              '<tg-emoji emoji-id="'
              + emoji_id
              + '">⚽️</tg-emoji> @ligebartar24'
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              data={
                  "chat_id": channel,
                  "text": text,
                  "parse_mode": "HTML"
              },
              timeout=30
          )

          print("STATUS:", response.status_code)
          print(response.text)
          PY
