name: Check Animated Emoji

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Emoji
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json

          token = os.environ["BOT_TOKEN"]
          emoji_id = 5791832221211959289

          url = f"https://api.telegram.org/bot{token}/getCustomEmojiStickers"

          response = requests.get(
              url,
              params={
                  "custom_emoji_ids": json.dumps([emoji_id])
              },
              timeout=30
          )

          print("STATUS:", response.status_code)
          print("================================")
          print(response.text)
          print("================================")

          if not response.ok:
              raise SystemExit(1)
          PY
