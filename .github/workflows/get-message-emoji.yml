name: Get Animated Emoji From Bot

on:
  workflow_dispatch:

jobs:
  get-emoji:
    runs-on: ubuntu-latest

    steps:
      - name: Read Telegram Message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json

          token = os.environ["BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getUpdates"

          response = requests.get(
              url,
              params={"limit": 20},
              timeout=30
          )

          print("STATUS:", response.status_code)

          data = response.json()

          if not data.get("ok"):
              print(data)
              raise SystemExit(1)

          print("================================")

          for update in data.get("result", []):
              message = update.get("message", {})

              if not message:
                  continue

              print("MESSAGE ID:", message.get("message_id"))
              print("TEXT:", repr(message.get("text", "")))
              print(
                  "ENTITIES:",
                  json.dumps(
                      message.get("entities", []),
                      ensure_ascii=False,
                      indent=2
                  )
              )

              print("================================")
          PY
