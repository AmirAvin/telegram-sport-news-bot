name: Inspect Telegram Emoji

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Telegram library
        run: |
          pip install python-telegram-bot==20.8

      - name: Create inspector
        run: |
          cat > inspect_emoji.py <<'PY'
          import os
          import asyncio
          from telegram import Bot

          BOT_TOKEN = os.environ["BOT_TOKEN"]

          async def main():
              bot = Bot(BOT_TOKEN)

              me = await bot.get_me()
              print("BOT:", me.username)

              print("این ربات آماده دریافت پیام است.")

          asyncio.run(main())
          PY

      - name: Run
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python inspect_emoji.py
