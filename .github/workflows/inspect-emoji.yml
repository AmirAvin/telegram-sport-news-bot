name: Inspect Telegram Emoji

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Telegram library
        run: pip install python-telegram-bot==20.8

      - name: Run python
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["BOT_TOKEN"]
          channel_id = os.environ["CHANNEL_ID"]

          r = requests.get(
              f"https://api.telegram.org/bot{token}/getMe",
              timeout=30
          )

          print("STATUS:", r.status_code)
          print(r.text)

          if r.status_code != 200:
              raise SystemExit("Telegram connection failed")

          print("Telegram connection OK")
          P
