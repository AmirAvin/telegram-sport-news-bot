name: Inspect Telegram Emoji

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Telegram library
        run: |
          pip install python-telegram-bot==20.8

      - name: Create checker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cat > emoji_checker.py <<'PY'
          import os
          import asyncio
          from telegram import Bot

          async def main():
              bot = Bot(os.environ["BOT_TOKEN"])

              print("====================================")
              print("Telegram Emoji Entity Checker")
              print("====================================")
              print("Waiting for forwarded message...")

              updates = await bot.get_updates(
                  timeout=60,
                  allowed_updates=["message"]
              )

              if not updates:
                  print("NO_MESSAGE_RECEIVED")
                  await bot.shutdown()
                  return

              for update in updates:
                  message = update.message

                  if not message:
                      continue

                  print("\n====================================")
                  print("MESSAGE ID:", message.message_id)
                  print("CHAT ID:", message.chat.id)

                  print("\nTEXT:")
                  print(message.text or message.caption or "")

                  print("\nMESSAGE ENTITIES:")

                  for entity in (message.entities or []):
                      print("------------------------------------")
                      print("TYPE:", entity.type)
                      print("OFFSET:", entity.offset)
                      print("LENGTH:", entity.length)
                      print("CUSTOM EMOJI ID:", entity.custom_emoji_id)
                      print("URL:", entity.url)

                  print("\nCAPTION ENTITIES:")

                  for entity in (message.caption_entities or []):
                      print("------------------------------------")
                      print("TYPE:", entity.type)
                      print("OFFSET:", entity.offset)
                      print("LENGTH:", entity.length)
                      print("CUSTOM EMOJI ID:", entity.custom_emoji_id)
                      print("URL:", entity.url)

              await bot.shutdown()

          asyncio.run(main())
          PY

          python emoji_checker.py
