name: Inspect Telegram Emoji

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install python-telegram-bot==20.8

      - name: Inspect messages
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cat > inspect.py <<'PY'
          import os
          import asyncio
          from telegram import Bot

          async def main():
              bot = Bot(os.environ["BOT_TOKEN"])

              print("✅ ربات آماده دریافت پیام است.")
              print("⏳ حالا پست نمونه را برای ربات Forward کن.")

              updates = await bot.get_updates(
                  timeout=60,
                  allowed_updates=["message"]
              )

              if not updates:
                  print("❌ هیچ پیام جدیدی دریافت نشد.")
                  return

              for update in updates:
                  message = update.message

                  if not message:
                      continue

                  print("\n==============================")
                  print("MESSAGE ID:", message.message_id)
                  print("TEXT:", message.text or message.caption or "")

                  print("\nENTITIES:")

                  for entity in (message.entities or []):
                      print(
                          "type =", entity.type,
                          "| offset =", entity.offset,
                          "| length =", entity.length,
                          "| custom_emoji_id =", entity.custom_emoji_id,
                          "| url =", entity.url
                      )

                  print("\nCAPTION ENTITIES:")

                  for entity in (message.caption_entities or []):
                      print(
                          "type =", entity.type,
                          "| offset =", entity.offset,
                          "| length =", entity.length,
                          "| custom_emoji_id =", entity.custom_emoji_id,
                          "| url =", entity.url
                      )

                  print("==============================")

          asyncio.run(main())
          PY

          python inspect.py
