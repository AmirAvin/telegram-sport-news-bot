name: Test Custom Emoji

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Telegram library
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot==20.8

      - name: Test Emoji
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          set -o pipefail
          echo "===== START TEST ====="
          python -u test_custom_emoji.py 2>&1 | tee result.txt
          echo "===== END TEST ====="

      - name: Show test result
        if: always()
        run: |
          echo "===== RESULT FILE ====="
          if [ -f result.txt ]; then
            cat result.txt
          else
            echo "result.txt was not created"
          fi
          echo "===== END RESULT ====="
